# usi-web.yaml — website presentation overrides for scripts/gen_data.py.
#
# The FACTS live in the USI corpus (../USI). This file only adds website chrome.
# A USI block is surfaced on the site when it has a `pillar` and `public` audience.
#
#   key      = USI block id (e.g. project-big-data-vr)
#   icon     = emoji shown on the card
#   curated  = include in curated strips
#   featured = hero/featured placement (else taken from the block's `featured`)
#   id       = website slug override (default: block id minus its type prefix)
#   summary  = override the auto-derived one-liner (else first body paragraph)
#   href     = override the auto-derived link
#   hidden   = true to exclude from the site
items:
