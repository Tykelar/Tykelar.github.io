  experience-glartek:                  { id: glartek-sqe, icon: "🧪", curated: true, summary: "Redesigned QA infrastructure and CI workflows on an AR-powered Digital Twin platform — cutting pipeline time by more than 50% and lifting features shipped per sprint." }
